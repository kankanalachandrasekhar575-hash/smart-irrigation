<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Irrigation Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Smart Irrigation Dashboard</h1>
    <section class="cards">
      <div class="card"><h2>Soil Moisture</h2>
        <p class="value"><span id="moisture">--</span>%</p></div>
      <div class="card"><h2>Temperature</h2>
        <p class="value"><span id="temperature">--</span>&deg;C</p></div>
      <div class="card"><h2>Pump</h2>
        <p class="value"><span id="pump-status" class="pump off">--</span></p></div>
    </section>
    <section class="soil-status">
      <span>Soil status:</span>
      <span id="soil-badge" class="badge">--</span>
      <small id="threshold-note"></small>
    </section>
    <button id="pump-btn" class="pump-btn" disabled>Loading...</button>
    <p id="message" class="message" role="status"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
